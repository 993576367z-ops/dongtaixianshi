<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>联系我们 - 示例企业</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">示例企业</a>
      <button class="nav-toggle" id="navToggleContact" aria-label="打开菜单">☰</button>
      <nav class="site-nav" id="siteNavContact">
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="services.html">服务</a>
        <a href="portfolio.html">作品</a>
        <a href="blog.html">博客</a>
        <a href="contact.html" class="active btn">联系我们</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1>联系我们</h1>
        <p>填写表单，我们会在1个工作日内回复。</p>

        <form id="contactForm" class="contact-form" data-endpoint="https://example.com/api/contact">
          <label>姓名 <input type="text" name="name" required></label>
          <label>公司 <input type="text" name="company"></label>
          <label>邮箱 <input type="email" name="email" required></label>
          <label>电话 <input type="tel" name="phone"></label>
          <label>内容 <textarea name="message" rows="6" required></textarea></label>
          <button type="submit" class="btn">发送</button>
          <p class="form-status" id="formStatus" aria-live="polite"></p>
        </form>

        <h2>其他联系方式</h2>
        <p>电话：010-1234-5678 · 邮箱：info@example.com</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left"><strong>示例企业</strong></div>
      <div class="footer-right"><small>© <span id="yearContact"></span> 示例企业。保留所有权利。</small></div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
